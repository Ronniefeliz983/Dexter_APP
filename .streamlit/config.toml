[theme]
# Azul brillante para elementos interactivos (basado en la imagen)
primaryColor="#0078d4"

# Fondo principal en un gris muy claro
backgroundColor="#f0f2f6"

# Sidebar y contenedores ("cuadros") en blanco puro
secondaryBackgroundColor="#ffffff"

# Texto en un gris oscuro para legibilidad
textColor="#31333F"

font="sans serif"
