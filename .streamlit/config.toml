[theme]
# Colores primarios y de fondo inspirados en la NUEVA imagen (con rojo)
primaryColor="#e74c3c"  # Un rojo brillante/medio para elementos interactivos
backgroundColor="#1e1e1e" # Fondo principal muy oscuro (casi negro)
secondaryBackgroundColor="#2a2a2a" # Fondo ligeramente más claro para sidebar, contenedores
textColor="#ffffff" # Texto principal blanco
font="sans serif" # Fuente limpia

[server]
maxUploadSize = 10
maxMessageSize = 10
enableCORS = false
enableXsrfProtection = true
runOnSave = false
headless = true
port = 10000
address = "0.0.0.0"

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"
serverPort = 10000

[runner]
magicEnabled = false
installTracer = false
fastReruns = true

[client]
showErrorDetails = false
toolbarMode = "minimal"
