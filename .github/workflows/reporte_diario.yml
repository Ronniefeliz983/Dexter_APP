name: Envio Reporte Diario 5:30PM

on:
  schedule:
    # 21:30 UTC es exactamente las 5:30 PM en República Dominicana (AST)
    - cron: '30 21 * * *'
  workflow_dispatch: # Esto permite que puedas ejecutarlo manualmente para probar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas sqlalchemy psycopg2-binary openpyxl

      - name: Ejecutar script de envío
        env:
          # Aquí conectamos los "Secrets" de GitHub con el script
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_JEFE: ${{ secrets.EMAIL_JEFE }}
        run: python correo_automatico.py
